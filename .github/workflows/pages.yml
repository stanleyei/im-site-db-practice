name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # index.html 已在 repo 內（由講師本機的 npm run site 產生），CI 只需建置 CSS
      - run: npm run build:css
      - name: 組出部署目錄
        run: |
          mkdir -p dist/css
          cp index.html favicon.ico dist/
          cp css/style.css dist/css/
          cp -r js images docs dist/
          rm -rf dist/docs/private
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
